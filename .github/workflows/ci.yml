name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CARGO_TERM_COLOR: always

jobs:
  native:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-22.04, os: linux, arch: amd64, python: x64, target: x86_64-unknown-linux-musl }
          - { runner: ubuntu-22.04-arm, os: linux, arch: arm64, python: arm64, target: aarch64-unknown-linux-musl }
          - { runner: macos-15-intel, os: darwin, arch: amd64, python: x64, target: x86_64-apple-darwin }
          - { runner: macos-15, os: darwin, arch: arm64, python: arm64, target: aarch64-apple-darwin }
          - { runner: windows-2022, os: windows, arch: amd64, python: x64, target: x86_64-pc-windows-msvc }
          - { runner: windows-11-arm, os: windows, arch: arm64, python: arm64, target: aarch64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v4
      - name: Linux static toolchain
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: ${{ matrix.python }}
      - name: Rust formatting, native tests, and Clippy
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo test --locked --all-targets --features desktop --target '${{ matrix.target }}'
          cargo clippy --locked --all-targets --features desktop --target '${{ matrix.target }}' -- -D warnings
      - name: Native installer and release validation
        shell: bash
        run: |
          set -euo pipefail
          sh -n scripts/install.sh
          diff -q scripts/install.sh docs/public/install.sh
          diff -q scripts/install.ps1 docs/public/install.ps1
          python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Build and validate native release artifacts
        run: python3 scripts/build-release.py --os ${{ matrix.os }} --arch ${{ matrix.arch }}
      - name: Background service smoke with isolated profiles
        timeout-minutes: 3
        shell: bash
        env:
          NORIA_TEST_SKIP_LOGIN: '1'
        run: |
          set -euo pipefail
          suffix=''
          if [ '${{ matrix.os }}' = windows ]; then suffix=.exe; fi
          export NORIA_TEST_SERVICE_BIN="$PWD/dist/noria_${{ matrix.os }}_${{ matrix.arch }}$suffix"
          python3 scripts/test-service-smoke.py
      - name: Windows PowerShell installer syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'scripts/install.ps1'), [ref]$tokens, [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }

  go-reference:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Retained Go behavior fixtures (no live clients)
        run: go test -race ./...
