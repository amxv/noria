name: release

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GO_VERSION: "1.26.4"
  CLI_BINARY: "noria"
  CLI_ENTRYPOINT: "noria"
  CLI_MODULE: "github.com/amxv/noria"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - name: Validate version and source
        run: |
          python3 scripts/release.py check "$GITHUB_REF_NAME"
          go mod verify
          go test -race ./...
          go vet ./...
          make lint
          test -z "$(gofmt -l cmd internal)"
      - name: Check and build documentation
        run: |
          make docs-install
          make docs-check
          make docs-build

  build-binaries:
    needs: quality
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [darwin, linux, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          EXT=""
          if [ "$GOOS" = windows ]; then EXT=".exe"; fi
          VERSION="${GITHUB_REF_NAME#v}"
          go build -mod=readonly -trimpath \
            -ldflags="-s -w -X ${{ env.CLI_MODULE }}/internal/buildinfo.Version=$VERSION" \
            -o "dist/${{ env.CLI_BINARY }}_${GOOS}_${GOARCH}${EXT}" ./cmd/${{ env.CLI_ENTRYPOINT }}
      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  build-menubar:
    needs: quality
    runs-on: macos-latest
    strategy:
      matrix:
        arch: [arm64, amd64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Build signed native app and matching CLI
        shell: bash
        env:
          NORIA_VERSION: ${{ github.ref_name }}
          ARCH: ${{ matrix.arch }}
        run: |
          export NORIA_VERSION="${NORIA_VERSION#v}"
          mkdir -p stage dist
          swift_arch="$ARCH"
          if [ "$ARCH" = amd64 ]; then swift_arch=x86_64; fi
          ./apps/menubar/build.sh "$PWD/stage/Noria.app" "$swift_arch"
          CGO_ENABLED=0 GOOS=darwin GOARCH="$ARCH" go build -mod=readonly -trimpath \
            -ldflags="-s -w -X ${{ env.CLI_MODULE }}/internal/buildinfo.Version=$NORIA_VERSION" \
            -o stage/noria ./cmd/noria
          codesign --verify --deep --strict stage/Noria.app
          if [ "$(uname -m)" = "$swift_arch" ]; then
            stage/noria --version
            stage/Noria.app/Contents/MacOS/noria-menubar --check
            stage/Noria.app/Contents/MacOS/noria-menubar --validate-status-json apps/menubar/Tests/status.json
            stage/Noria.app/Contents/MacOS/noria-menubar --validate-compact-status-json apps/menubar/Tests/compact-status.json
            stage/Noria.app/Contents/MacOS/noria-menubar --validate-fable-status-json apps/menubar/Tests/fable-status.json
          fi
          cp LICENSE THIRD_PARTY_NOTICES.md stage/
          COPYFILE_DISABLE=1 tar -czf "dist/noria_darwin_${ARCH}.tar.gz" -C stage noria Noria.app LICENSE THIRD_PARTY_NOTICES.md
      - uses: actions/upload-artifact@v4
        with:
          name: menubar-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error

  build-tray:
    needs: quality
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Build matching CLI and Go tray bundle
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p stage dist
          ext=""
          gui_flags=""
          if [ "$GOOS" = windows ]; then ext=.exe; gui_flags=' -H windowsgui'; fi
          go build -mod=readonly -trimpath \
            -ldflags="-s -w -X ${{ env.CLI_MODULE }}/internal/buildinfo.Version=$VERSION" \
            -o "stage/noria$ext" ./cmd/noria
          go build -mod=readonly -trimpath \
            -ldflags="-s -w -X main.version=$VERSION$gui_flags" \
            -o "stage/noria-tray$ext" ./cmd/noria-tray
          cp LICENSE THIRD_PARTY_NOTICES.md stage/
          tar -czf "dist/noria_${GOOS}_${GOARCH}.tar.gz" -C stage "noria$ext" "noria-tray$ext" LICENSE THIRD_PARTY_NOTICES.md
      - uses: actions/upload-artifact@v4
        with:
          name: tray-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*.tar.gz
          if-no-files-found: error

  github-release:
    needs: [build-binaries, build-menubar, build-tray]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Verify six binaries, two macOS apps and four tray bundles; generate checksums
        run: |
          test "$(find dist -maxdepth 1 -type f -name 'noria_*' ! -name '*.tar.gz' | wc -l)" -eq 6
          test "$(find dist -maxdepth 1 -type f -name 'noria_darwin_*.tar.gz' | wc -l)" -eq 2
          test "$(find dist -maxdepth 1 -type f -name 'noria_linux_*.tar.gz' | wc -l)" -eq 2
          test "$(find dist -maxdepth 1 -type f -name 'noria_windows_*.tar.gz' | wc -l)" -eq 2
          (cd dist && sha256sum noria_* > SHA256SUMS)
          cp LICENSE THIRD_PARTY_NOTICES.md dist/
          python3 scripts/release.py notes "$GITHUB_REF_NAME" > release-notes.md
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: Noria ${{ github.ref_name }}
          body_path: release-notes.md
          files: dist/*
          fail_on_unmatched_files: true

  install-smoke:
    needs: github-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Verify native install on macOS and Linux
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          export NORIA_VERSION="${GITHUB_REF_NAME#v}"
          export NORIA_HOME="$RUNNER_TEMP/noria-smoke"
          export NORIA_INSTALL_DIR="$RUNNER_TEMP/noria-install"
          export NORIA_NO_LAUNCH=1
          sh scripts/install.sh
          "$NORIA_INSTALL_DIR/noria" --version | grep -Fx "noria $NORIA_VERSION"
          "$NORIA_INSTALL_DIR/noria" --help
          "$NORIA_INSTALL_DIR/noria" status --json
          "$NORIA_INSTALL_DIR/noria" upgrade --check --json
          if [ "$RUNNER_OS" = macOS ]; then
            codesign --verify --deep --strict "$NORIA_INSTALL_DIR/Noria.app"
            "$NORIA_INSTALL_DIR/Noria.app/Contents/MacOS/noria-menubar" --check
            "$NORIA_INSTALL_DIR/Noria.app/Contents/MacOS/noria-menubar" --validate-status-json apps/menubar/Tests/status.json
            "$NORIA_INSTALL_DIR/Noria.app/Contents/MacOS/noria-menubar" --validate-compact-status-json apps/menubar/Tests/compact-status.json
          else
            "$NORIA_INSTALL_DIR/noria-tray" --check
            "$NORIA_INSTALL_DIR/noria" tray --help
          fi
      - name: Verify native Windows install
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:NORIA_VERSION = $env:GITHUB_REF_NAME.Substring(1)
          $env:NORIA_HOME = Join-Path $env:RUNNER_TEMP 'noria-smoke'
          $env:NORIA_INSTALL_DIR = Join-Path $env:RUNNER_TEMP 'noria-install'
          $env:NORIA_NO_LAUNCH = '1'
          & ./scripts/install.ps1
          $exe = Join-Path $env:NORIA_INSTALL_DIR 'noria.exe'
          $tray = Join-Path $env:NORIA_INSTALL_DIR 'noria-tray.exe'
          if (-not (Test-Path $tray)) { throw 'Windows tray executable missing' }
          & $tray --check
          if ($LASTEXITCODE -ne 0) { throw 'Windows tray self-check failed' }
          if ((& $exe --version) -ne "noria $env:NORIA_VERSION") { throw 'Native install version mismatch' }
          & $exe --help
          & $exe status --json | ConvertFrom-Json | Out-Null
          & $exe upgrade --check --json | ConvertFrom-Json | Out-Null
          # A running Windows executable cannot safely replace itself.
          # Exercise the detached new-binary helper against a private copy;
          # this must never modify an actual user installation.
          $pending = Join-Path $env:NORIA_INSTALL_DIR '.noria-upgrade-test.exe'
          $trayPending = Join-Path $env:NORIA_INSTALL_DIR '.noria-tray-upgrade-test.exe'
          Copy-Item $exe $pending
          Copy-Item $tray $trayPending
          & $pending __apply-windows-upgrade $exe 'false' $env:NORIA_VERSION $trayPending --home $env:NORIA_HOME
          if ($LASTEXITCODE -ne 0) { throw 'Native deferred Windows upgrade helper failed' }
          $report = Get-Content (Join-Path $env:NORIA_HOME 'upgrade.json') -Raw | ConvertFrom-Json
          if (-not $report.updated) { throw 'Native Windows upgrade did not commit its state' }
          & $tray --check
          if ($LASTEXITCODE -ne 0) { throw 'Native Windows tray upgrade failed' }
