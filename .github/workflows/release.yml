name: release

on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Linux static toolchain
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - name: Validate version and source
        run: |
          python3 scripts/release.py check "$GITHUB_REF_NAME"
          make check
          make test-go-parity
      - name: Check and build documentation
        run: |
          make docs-install
          make docs-check
          make docs-build

  build-native:
    needs: quality
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-22.04, os: linux, arch: amd64, python: x64, target: x86_64-unknown-linux-musl }
          - { runner: ubuntu-22.04-arm, os: linux, arch: arm64, python: arm64, target: aarch64-unknown-linux-musl }
          - { runner: macos-15-intel, os: darwin, arch: amd64, python: x64, target: x86_64-apple-darwin }
          - { runner: macos-15, os: darwin, arch: arm64, python: arm64, target: aarch64-apple-darwin }
          - { runner: windows-2022, os: windows, arch: amd64, python: x64, target: x86_64-pc-windows-msvc }
          - { runner: windows-11-arm, os: windows, arch: arm64, python: arm64, target: aarch64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v4
      - name: Linux static toolchain
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: ${{ matrix.python }}
      - name: Native tests
        run: cargo test --locked --all-targets --features desktop --target ${{ matrix.target }}
      - name: Build matching CLI and native desktop archive
        run: python3 scripts/build-release.py --os ${{ matrix.os }} --arch ${{ matrix.arch }}
      - name: Background service smoke with isolated profiles
        timeout-minutes: 3
        shell: bash
        env:
          NORIA_TEST_SKIP_LOGIN: '1'
        run: |
          set -euo pipefail
          suffix=''
          if [ '${{ matrix.os }}' = windows ]; then suffix=.exe; fi
          export NORIA_TEST_SERVICE_BIN="$PWD/dist/noria_${{ matrix.os }}_${{ matrix.arch }}$suffix"
          python3 scripts/test-service-smoke.py
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  github-release:
    needs: build-native
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Verify all six binaries and six desktop archives; generate checksums
        run: |
          python3 scripts/release.py checksums dist
          python3 scripts/release.py verify dist
          cp LICENSE THIRD_PARTY_NOTICES.md dist/
          python3 scripts/release.py notes "$GITHUB_REF_NAME" > release-notes.md
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: Noria ${{ github.ref_name }}
          body_path: release-notes.md
          files: dist/*
          fail_on_unmatched_files: true

  install-smoke:
    needs: github-release
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-22.04, os: linux, arch: amd64 }
          - { runner: ubuntu-22.04-arm, os: linux, arch: arm64 }
          - { runner: macos-15-intel, os: darwin, arch: amd64 }
          - { runner: macos-15, os: darwin, arch: arm64 }
          - { runner: windows-2022, os: windows, arch: amd64 }
          - { runner: windows-11-arm, os: windows, arch: arm64 }
    steps:
      - uses: actions/checkout@v4
      - name: Verify native macOS and Linux install with isolated profiles
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/noria-user"
          export NORIA_HOME="$RUNNER_TEMP/noria-smoke"
          export CODEX_HOME="$HOME/codex" CLAUDE_CONFIG_DIR="$HOME/claude"
          export XDG_CONFIG_HOME="$HOME/config" XDG_CACHE_HOME="$HOME/cache"
          export NORIA_VERSION="${GITHUB_REF_NAME#v}"
          export NORIA_INSTALL_DIR="$RUNNER_TEMP/noria-install"
          export NORIA_NO_LAUNCH=1
          mkdir -p "$HOME"
          sh scripts/install.sh
          "$NORIA_INSTALL_DIR/noria" --version | grep -Fx "noria $NORIA_VERSION"
          "$NORIA_INSTALL_DIR/noria" --help
          "$NORIA_INSTALL_DIR/noria" status --json
          "$NORIA_INSTALL_DIR/noria" upgrade --check --json
          if [ "$RUNNER_OS" = macOS ]; then
            codesign --verify --deep --strict "$NORIA_INSTALL_DIR/Noria.app"
            "$NORIA_INSTALL_DIR/Noria.app/Contents/MacOS/noria-menubar" --check
            "$NORIA_INSTALL_DIR/Noria.app/Contents/MacOS/noria-menubar" --validate-status-json apps/menubar/Tests/status.json
            "$NORIA_INSTALL_DIR/Noria.app/Contents/MacOS/noria-menubar" --validate-compact-status-json apps/menubar/Tests/compact-status.json
          else
            "$NORIA_INSTALL_DIR/noria-tray" --check
            "$NORIA_INSTALL_DIR/noria" tray --help
          fi
      - name: Verify native Windows install with isolated profiles
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:NORIA_VERSION = $env:GITHUB_REF_NAME.Substring(1)
          $env:HOME = Join-Path $env:RUNNER_TEMP 'noria-user'
          $env:USERPROFILE = $env:HOME
          $env:APPDATA = Join-Path $env:HOME 'appdata'
          $env:LOCALAPPDATA = Join-Path $env:HOME 'localappdata'
          $env:CODEX_HOME = Join-Path $env:HOME 'codex'
          $env:CLAUDE_CONFIG_DIR = Join-Path $env:HOME 'claude'
          $env:NORIA_HOME = Join-Path $env:RUNNER_TEMP 'noria-smoke'
          $env:NORIA_INSTALL_DIR = Join-Path $env:RUNNER_TEMP 'noria-install'
          $env:NORIA_NO_LAUNCH = '1'
          New-Item -ItemType Directory -Force $env:HOME | Out-Null
          & ./scripts/install.ps1
          $exe = Join-Path $env:NORIA_INSTALL_DIR 'noria.exe'
          $tray = Join-Path $env:NORIA_INSTALL_DIR 'noria-tray.exe'
          if (-not (Test-Path $tray)) { throw 'Windows tray executable missing' }
          & $tray --check
          if ($LASTEXITCODE -ne 0) { throw 'Windows tray self-check failed' }
          if ((& $exe --version) -ne "noria $env:NORIA_VERSION") { throw 'Native install version mismatch' }
          & $exe --help
          & $exe status --json | ConvertFrom-Json | Out-Null
          & $exe upgrade --check --json | ConvertFrom-Json | Out-Null
          $pending = Join-Path $env:NORIA_INSTALL_DIR '.noria-upgrade-test.exe'
          $trayPending = Join-Path $env:NORIA_INSTALL_DIR '.noria-tray-upgrade-test.exe'
          Copy-Item $exe $pending
          Copy-Item $tray $trayPending
          & $pending __apply-windows-upgrade $exe 'false' $env:NORIA_VERSION $trayPending --home $env:NORIA_HOME
          if ($LASTEXITCODE -ne 0) { throw 'Native deferred Windows upgrade helper failed' }
          $report = Get-Content (Join-Path $env:NORIA_HOME 'upgrade.json') -Raw | ConvertFrom-Json
          if (-not $report.updated) { throw 'Native Windows upgrade did not commit its state' }
          & $tray --check
          if ($LASTEXITCODE -ne 0) { throw 'Native Windows tray upgrade failed' }
