# Release binaries stay self-contained on Linux and Windows. Rust supplies musl
# startup objects and libc; the native linker supports its static-PIE flags.
# Older musl-gcc wrappers drop those flags (rust-lang/rust#95926). musl-tools
# remains required for C dependency compilation, but must not link Rust binaries.
[target.x86_64-unknown-linux-musl]
linker = "cc"

[target.aarch64-unknown-linux-musl]
linker = "cc"

[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[target.aarch64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
