[package]
name = "noria"
version = "0.4.2"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"
description = "Local native Codex and Claude account gateway"
repository = "https://github.com/amxv/noria"
default-run = "noria"

[features]
default = []
desktop = ["dep:tray-icon", "dep:windows-sys", "dep:zbus"]

[dependencies]
anyhow = "1"
async-stream = "0.3"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
flate2 = "1"
fs2 = "0.4"
futures-util = { version = "0.3", features = ["sink"] }
getrandom = "0.3"
httpdate = "1"
hyper = { version = "1", features = ["http1", "http2", "server"] }
hyper-util = { version = "0.1", features = ["server-auto", "service", "tokio"] }
libc = "0.2"
notify = "8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.10"
tar = "0.4"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "net", "sync", "time", "io-util", "io-std", "fs", "process", "signal"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
tokio-util = { version = "0.7", features = ["rt"] }
toml_edit = "0.23"
url = "2"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
tray-icon = { version = "0.26", default-features = false, features = ["ksni"], optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", optional = true, features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading"] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"], optional = true }

[[bin]]
name = "noria"
path = "src/main.rs"

[[bin]]
name = "noria-tray"
path = "src/bin/noria-tray.rs"
required-features = ["desktop"]

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

